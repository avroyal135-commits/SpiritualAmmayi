name: Generate Devotional Shorts

on:
  schedule:
    # Runs once a day at 03:00 UTC (~08:30 IST). Adjust as needed.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      shorts_override:
        description: "Optional: override shorts_per_run for this manual run (leave blank to use channel_config.json)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate assets
        run: python prepare_assets.py

      - name: Apply manual shorts_per_run override (if provided)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.shorts_override != '' }}
        run: |
          python - << 'PY'
          import json
          path = "channel_config.json"
          with open(path) as f:
              cfg = json.load(f)
          cfg["shorts_per_run"] = int("${{ github.event.inputs.shorts_override }}")
          with open(path, "w") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("Overrode shorts_per_run ->", cfg["shorts_per_run"])
          PY

      - name: Generate Shorts
        id: generate
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          python generate_short.py

      - name: Upload generated files as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devotional-shorts-${{ github.run_id }}
          path: |
            output/**
            history.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job loudly if generation failed
        if: failure()
        run: |
          echo "::error::Short generation failed. Check the 'Generate Shorts' step logs above for details."
          exit 1
